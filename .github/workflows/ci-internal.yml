name: CI (Internal / Self-hosted)

# 사내망(폐쇄망) 전용 워크플로우
# Self-hosted runner가 사내 Windows 머신에 등록되어 있어야 합니다.
# 설정 방법: https://docs.github.com/en/actions/hosting-your-own-runners
#
# Runner 레이블 설정:
#   1. GitHub 저장소 → Settings → Actions → Runners → New self-hosted runner
#   2. 사내 Windows PC에서 runner 에이전트 설치 (GitHub Actions runner app)
#   3. 레이블 추가: "self-hosted", "windows", "internal"
#
# GitHub Secrets 설정 (Settings → Secrets and variables → Actions):
#   INTERNAL_LLM_BASE_URL: 사내 LLM API base URL (예: http://192.168.x.x:8000/v1)
#   INTERNAL_LLM_MODEL: 사내 LLM 모델명
#   INTERNAL_API_KEY: 사내 LLM API 키 (없으면 빈 문자열)
#   OBSIDIAN_VAULT_PATH: 사내 Obsidian Vault 경로 (선택)
#   OBSIDIAN_HOST: Obsidian Local REST API 주소 (선택)

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      test_scope:
        description: "실행할 테스트 범위"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - unit
          - integration
          - smoke

jobs:
  test-full:
    name: Full Tests (Internal / Self-hosted)
    runs-on: [self-hosted, windows, internal]

    env:
      # 사내 LLM 설정 (Secrets에서 주입)
      LLM_ACTIVE: internal
      LLM_INTERNAL_BASE_URL: ${{ secrets.INTERNAL_LLM_BASE_URL }}
      LLM_INTERNAL_MODEL: ${{ secrets.INTERNAL_LLM_MODEL }}
      OPENAI_API_KEY: ${{ secrets.INTERNAL_API_KEY || 'unused' }}
      # Obsidian (선택)
      OBSIDIAN_VAULT_PATH: ${{ secrets.OBSIDIAN_VAULT_PATH || '' }}
      OBSIDIAN_HOST: ${{ secrets.OBSIDIAN_HOST || '' }}
      # CI 환경 표시
      CI: "true"
      INTERNAL_CI: "true"  # requires_display / requires_office 마커 미스킵

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        shell: pwsh

      - name: Run tests
        shell: pwsh
        run: |
          $scope = "${{ github.event.inputs.test_scope || 'all' }}"
          switch ($scope) {
            "unit"        { python -m pytest tests/unit --tb=short -v --junitxml=test-results.xml }
            "integration" { python -m pytest tests/integration --tb=short -v --junitxml=test-results.xml }
            "smoke"       { python -m pytest tests/smoke --tb=short -v --junitxml=test-results.xml }
            default {
              # 전체 실행 (requires_display 제외 — 실제 GUI 자동화는 수동 테스트)
              python -m pytest -m "not requires_display" `
                --tb=short -v `
                --junitxml=test-results.xml
            }
          }

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-internal
          path: test-results.xml
