<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>협업 코치</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent; overflow: hidden; user-select: none; }
    body {
      font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
      padding: 8px;
    }
    #card {
      -webkit-app-region: drag;
      background: rgba(22, 33, 62, 0.92);
      border: 1px solid #2a4a7c;
      border-radius: 12px;
      padding: 12px 14px;
      color: #e6edf3;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      height: 144px;
      display: flex;
      flex-direction: column;
    }
    #hud-header {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; color: #9db8e0; margin-bottom: 6px; flex-shrink: 0;
    }
    #hud-title { font-weight: 600; }
    #hud-hint {
      flex: 1; font-size: 13.5px; line-height: 1.45; color: #f0f4f8;
      overflow-y: auto; word-break: break-word;
    }
    #hud-hint.idle { color: #6b7a90; font-style: italic; }
    #hud-actions {
      display: flex; gap: 6px; margin-top: 8px; flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    button {
      -webkit-app-region: no-drag;
      flex: 1; border: none; border-radius: 6px; cursor: pointer;
      font-size: 12px; padding: 6px 0; color: #c0d8ff; background: #0f3460;
    }
    button:hover { background: #1b4a85; }
    #hud-close { flex: 0 0 28px; background: transparent; color: #6b7a90; font-size: 14px; }
    #hud-close:hover { color: #e94560; background: transparent; }
  </style>
</head>
<body>
  <div id="card">
    <div id="hud-header">
      <span id="hud-title">🤝 코치</span>
      <button id="hud-close" title="협업 종료">✕</button>
    </div>
    <div id="hud-hint" class="idle">관찰 중…</div>
    <div id="hud-actions">
      <button id="hud-manual">👁 지금 봐줘</button>
    </div>
  </div>
  <script src="hud.js"></script>
</body>
</html>
