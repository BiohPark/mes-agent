[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
markers =
    requires_llm: 실제 LLM API 호출이 필요한 테스트 (사내망 CI 또는 유효한 API 키 필요)
    requires_display: 디스플레이/마우스/OCR/브라우저 등 화면 접근이 필요한 테스트
    requires_office: MS Office COM, Tesseract 등 데스크탑 소프트웨어가 필요한 테스트
